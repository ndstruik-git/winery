<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winery</title>
<meta name="apple-mobile-web-app-title" content="Winery">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221B15" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #F7F3EC; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17120E; } }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  /* the app runs down to the home bar; the strip under the bar matches the app */
  iframe {
    position: fixed; top: 0; left: 0; right: 0;
    bottom: env(safe-area-inset-bottom, 0px);
    width: 100%; height: calc(100% - env(safe-area-inset-bottom, 0px));
    border: 0; display: block; background: var(--bg);
  }
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbwCToU3SR1-1M3aFMdgMEUrO4z6_Xan7zOGUyEJDhXv_ot-0ZxTHJtW48wzwvpg17hPiQ/exec"
        title="Niri's Winery" allow="clipboard-write"></iframe>
</body>
</html>
